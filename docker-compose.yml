services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      # When serving everything on the same domain via Nginx, this should be that domain origin.
      # Example: https://chat.yourdomain.com
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Optional: attachments/avatars (Cloudinary) and password-reset email (SMTP)
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Number of proxies in front of the backend: 1 = this nginx only,
      # 2 = another reverse proxy on the host in front of it.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    expose:
      - "5000"

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Set APP_PORT=127.0.0.1:8080 when the host already runs its own web server.
      - "${APP_PORT:-80}:80"
