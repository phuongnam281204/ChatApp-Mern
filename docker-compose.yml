services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      # When serving everything on the same domain via Nginx, this should be that domain origin.
      # Example: https://chat.yourdomain.com
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Optional: attachments/avatars (Cloudinary) and password-reset email (SMTP)
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    expose:
      - "5000"

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
